<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Admission | SBAS</title><link rel="stylesheet" href="assets/style.css"><style>.public-wrap{max-width:1000px;margin:32px auto;padding:16px}.public-head{background:#102a43;color:#fff;padding:28px;border-radius:18px;margin-bottom:20px}.public-head h1{margin:6px 0}.public-form{background:#fff;border:1px solid #e3eaf1;border-radius:16px;padding:24px}.public-form h2{font-size:18px;margin:18px 0 10px}.public-form .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.public-form label{display:flex;flex-direction:column;gap:6px;font-size:14px}.public-form input,.public-form select{padding:11px;border:1px solid #ccd7e2;border-radius:9px;font:inherit}.public-form .wide{grid-column:1/-1}@media(max-width:650px){.public-form .form-grid{grid-template-columns:1fr}}</style></head><body><main class="public-wrap"><header class="public-head"><a href="index.html" style="color:#fff">← Admin Login</a><p class="eyebrow">SONAR BANGLA ADARSHO SCHOOL</p><h1>অনলাইন ভর্তি আবেদন</h1><p>Online Admission Application · আবেদন জমা দেওয়ার পর Admin যাচাই করবেন।</p></header><form id="admissionForm" class="public-form"><h2>শিক্ষার্থীর তথ্য / Student Information</h2><div class="form-grid"><label>Student Name (English) *<input name="nameEn" required></label><label>শিক্ষার্থীর নাম (বাংলা) *<input name="nameBn" required></label><label>Date of Birth *<input name="dob" type="date" required></label><label>Gender *<select name="gender" required><option value="">নির্বাচন</option><option>Male</option><option>Female</option><option>Other</option></select></label><label>Blood Group<select name="bloodGroup"><option value="">নির্বাচন</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label><label>Religion (ঐচ্ছিক)<input name="religion"></label><label>Nationality<input name="nationality" value="Bangladeshi"></label><label>Birth Registration Number<input name="birthRegistration"></label><label>Student Photo (সর্বোচ্চ 350KB)<input name="photo" type="file" accept="image/*"></label></div><h2>অভিভাবকের তথ্য / Guardian Information</h2><div class="form-grid"><label>Father's Name<input name="fatherName"></label><label>Mother's Name<input name="motherName"></label><label>Guardian Name *<input name="guardianName" required></label><label>Guardian Relation *<input name="guardianRelation" required></label><label>Guardian Mobile Number *<input name="guardianMobile" type="tel" required></label></div><h2>ঠিকানা / Address</h2><div class="form-grid"><label>Village / Area<input name="village"></label><label>Post Office<input name="postOffice"></label><label>Upazila<input name="upazila"></label><label>District<input name="district"></label></div><h2>ভর্তির তথ্য / Admission Details</h2><div class="form-grid"><label>Admission Class *<input name="admissionClass" required placeholder="যেমন: Class 6"></label><label>Section<input name="section"></label><label>Academic Year *<input name="academicYear" required value="2027"></label><label>Admission Date<input name="admissionDate" type="date"></label></div><p id="formMessage" role="status"></p><button class="primary" type="submit">আবেদন জমা দিন / Submit Application</button></form></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="assets/firebase-config.js"></script><script src="assets/admission.js"></script></body></html>
