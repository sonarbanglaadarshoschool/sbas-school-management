<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Admission | SBAS</title><link rel="stylesheet" href="assets/style.css"><style>.public-actions{display:flex;justify-content:space-between;align-items:center}.public-head .eyebrow{color:#bfc7ff}.public-wrap{max-width:1000px;margin:32px auto;padding:16px}.public-head{background:#102a43;color:#fff;padding:28px;border-radius:18px;margin-bottom:20px}.public-head h1{margin:6px 0}.public-form{background:#fff;border:1px solid #e3eaf1;border-radius:16px;padding:24px}.public-form h2{font-size:18px;margin:18px 0 10px}.public-form .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.public-form label{display:flex;flex-direction:column;gap:6px;font-size:14px}.public-form input,.public-form select{padding:11px;border:1px solid #ccd7e2;border-radius:9px;font:inherit}.public-form .wide{grid-column:1/-1}@media(max-width:650px){.public-form .form-grid{grid-template-columns:1fr}}</style></head><body><main class="public-wrap"><header class="public-head"><div class="public-actions"><a href="index.html" style="color:#fff">← Admin Login</a><button type="button" id="publicLang" class="outline-btn">English</button></div><div id="publicBrand"><p class="eyebrow" id="publicSchoolName">SONAR BANGLA ADARSHO SCHOOL</p><h1 id="publicTitle">অনলাইন ভর্তি আবেদন</h1><p id="publicSubtitle">Online Admission Application · আবেদন জমা দেওয়ার পর Admin যাচাই করবেন।</p></div><img id="publicBanner" class="public-banner" alt="School banner" hidden><div id="publicNotice" class="public-notice" hidden></div><div id="publicContact" class="public-contact"></div></header><form id="admissionForm" class="public-form"><h2>শিক্ষার্থীর তথ্য / Student Information</h2><div class="form-grid"><label>Student Name (English) *<input name="nameEn" required></label><label>শিক্ষার্থীর নাম (বাংলা) *<input name="nameBn" required></label><label>Date of Birth *<input name="dob" type="date" required></label><label>Gender *<select name="gender" required><option value="">নির্বাচন</option><option>Male</option><option>Female</option><option>Other</option></select></label><label>Blood Group<select name="bloodGroup"><option value="">নির্বাচন</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label><label>Religion<select name="religion"><option value="">Select Religion</option><option>Islam</option><option>Hinduism</option><option>Buddhism</option><option>Christianity</option><option>Other</option></select></label><label>Nationality<select name="nationality"><option>Bangladeshi</option><option>Other</option></select></label><label>Birth Registration Number<input name="birthRegistration"></label><label>Student Photo URL / Image Link<input name="photoURL" type="url" placeholder="https://example.com/student-photo.jpg"><small>ছবি আগে অনলাইনে আপলোড করে সরাসরি ছবির লিংক দিন।</small></label></div><h2>অভিভাবকের তথ্য / Guardian Information</h2><div class="form-grid"><label>Father's Name<input name="fatherName"></label><label>Mother's Name<input name="motherName"></label><label>Guardian Name *<input name="guardianName" required></label><label>Guardian Relation *<select name="guardianRelation" required><option value="">Select Relation</option><option>Father</option><option>Mother</option><option>Brother</option><option>Sister</option><option>Legal Guardian</option><option>Other</option></select></label><label>Guardian Mobile Number *<input name="guardianMobile" type="tel" required></label></div><h2>ঠিকানা / Address</h2><div class="form-grid"><label>Village / Area<input name="village"></label><label>Post Office<input name="postOffice"></label><label>Upazila<input name="upazila"></label><label>District<input name="district"></label></div><h2>ভর্তির তথ্য / Admission Details</h2><div class="form-grid"><label>Admission Class *<select name="admissionClass" required><option value="">Select Class</option><option>Play</option><option>Nursery</option><option>KG</option><option>১</option><option>২</option><option>৩</option><option>৪</option><option>৫</option><option>৬</option><option>৭</option><option>৮</option><option>৯</option><option>১০</option></select></label><label>Section<select name="section"><option value="">Select Section</option><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label>Academic Year *<select name="academicYear" required><option>2027</option><option>2028</option><option>2029</option></select></label><label>Admission Date<input name="admissionDate" type="date"></label></div><p id="formMessage" role="status"></p><button class="primary" type="submit">আবেদন জমা দিন / Submit Application</button></form></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="assets/firebase-config.js"></script><script src="assets/admission.js"></script></body></html>
